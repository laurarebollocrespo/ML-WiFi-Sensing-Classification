# ===== UNDERSTANDING PREPROCESSING STRATEGIES =====
#
# Model-Aware Preprocessing automatically selects features and transformations
# based on each model's statistical assumptions:
#
# CLASSICAL STATISTICAL (LDA, QDA, Naive Bayes):
#   - Assume Gaussian distributions
#   - Preprocessing: Standardize + Feature Selection
#   - Why: Zero-mean unit variance matches Gaussian assumption
#
# DISTANCE-BASED (KNN):
#   - Sensitive to feature scales (Euclidean distance)
#   - Preprocessing: MinMax scaling [0,1] + PCA reduction
#   - Why: Symmetric distances + avoid curse of dimensionality
#
# SVM (RBF kernel):
#   - Kernel computation scale-sensitive
#   - Preprocessing: StandardScaler + aggressive PCA
#   - Why: RBF depends on Euclidean distance; too many dims → slow
#
# TREE ENSEMBLES (RF, XGBoost, GradientBoosting):
#   - Trees split on values, not distances
#   - Preprocessing: NO scaling, all features preserved
#   - Why: Trees naturally handle non-uniform scales; feature interactions beneficial
#
# NEURAL NETWORKS (MLP):
#   - Universal approximators; learn feature interactions
#   - Preprocessing: RobustScaler (outlier-resistant) + moderate PCA
#   - Why: Need normalized inputs for gradient descent; can learn interactions
#
# CLUSTERING (KMeans, GMM):
#   - Distance-based; needs compact latent representation
#   - Preprocessing: StandardScaler + aggressive PCA
#   - Why: Curse of dimensionality; PCA provides interpretable embedding
#
# ===== KEY INSIGHT =====
# The preprocessing is NOT generic. It's optimized for each model's
# statistical assumptions. This can improve F1 score by 5-15% compared
# to using a one-size-fits-all approach.
