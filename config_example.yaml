# config_example.yaml
# ==================
# Example configuration for CSI classification with model-aware preprocessing
#
# This configuration demonstrates:
# 1. Proper use of model_name to trigger model-specific preprocessing
# 2. Hyperparameter grids appropriate for the selected model
# 3. Proper cross-validation and evaluation setup
#
# To use: python main.py train config_example.yaml

# ===== DATA SETTINGS =====
data_path: "data/raw/train.csv"
test_data_path: "data/raw/test_nolabels.csv"
target_col: "position"

# ===== PREPROCESSING SETTINGS =====
# IMPORTANT: model_name triggers automatic selection of preprocessing strategy
# Each model in MODEL_REGISTRY has an optimized preprocessing pipeline
# 
# Examples:
#   - 'random_forest': Trees + feature engineering (no scaling)
#   - 'xgboost': Gradient boosting + all features
#   - 'svm': RBF kernel + amplitude/phase + aggressive PCA
#   - 'lda': Classical statistical + standardization + feature selection
#   - 'mlp': Neural network + robust scaling + moderate PCA
#   - 'knn': Distance-based + minmax scaling + PCA
#
model_name: "xgboost"

# Optional: override cache directory
# cache_dir: "data/processed"

# ===== CROSS-VALIDATION SETTINGS =====
cv_folds: 5
scoring: "f1_macro"  # F1 for multi-class classification

# ===== HYPERPARAMETER GRID =====
# Grid for XGBoost (example)
# Choose hyperparameters that make sense for the model and data size
param_grid:
  n_estimators: [100, 200, 300]
  max_depth: [7, 10, 15]
  learning_rate: [0.01, 0.05, 0.1]
  subsample: [0.7, 1.0]
  colsample_bytree: [0.7, 1.0]

---

