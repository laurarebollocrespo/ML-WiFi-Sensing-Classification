[project]
name = "ml-wifi-sensing"
version = "0.1.0"
description = "Wi-Fi CSI classification for AA1 competition"
requires-python = ">=3.11"
dependencies = [
  "scikit-learn>=1.4",
  "pandas>=2.0",
  "numpy>=1.26",
  "wandb>=0.17",
  "loguru>=0.7",
  "pyyaml>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "ipykernel>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
