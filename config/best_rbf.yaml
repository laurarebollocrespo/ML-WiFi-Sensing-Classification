# Data settings
data_path: "data/raw/train_nt.csv" # Adjust based on your chosen dataset
test_data_path: "data/raw/test_nolabels_nt.csv"
target_col: "position"
test_size: 0.2

# Training settings
model_name: "svm"
cv_folds: 5
scoring: "f1_macro"

# Hyperparameter Search Space
param_grid:
  kernel: ['rbf']
  C: [10]
  gamma: [0.0125]