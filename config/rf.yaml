# Data settings
data_path: "data/processed/train_original.csv"
test_data_path: "data/processed/test_original.csv"
target_col: "position"
test_size: 0.2
models_dir: "outputs/models"
experiments_dir: "outputs/experiments"
submissions_dir: "outputs/submissions"

# Training settings
model_name: "random_forest"
cv_folds: 5
scoring: "f1_macro"

# Hyperparameter Search Space
param_grid:
  n_estimators: [100, 200, 300]
  max_depth: [null, 10, 20, 30]
  min_samples_split: [2, 5, 10]