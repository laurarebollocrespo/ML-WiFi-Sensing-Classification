data_path: "data/raw/train_nt.csv"
test_data_path: "data/raw/test_nolabels_nt.csv"
target_col: "position"
models_dir: "outputs/models"
experiments_dir: "outputs/experiments"
submissions_dir: "outputs/submissions"

model_name: "xgboost"
cv_folds: 5
scoring: "f1_macro"

