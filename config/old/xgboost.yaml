param_grid:
  tree_method: ['hist'] #faster
  learning_rate: [0.1]       # Frozen
  n_estimators: [500]        # Frozen
  max_depth: [5]             # Frozen
  subsample: [0.6, 0.8, 1.0] # Tuning
  colsample_bytree: [0.6, 0.8, 1.0] # Tuning
  gamma: [0, 0.1, 1.0]       # Tuning
  n_jobs: [1]                #faster