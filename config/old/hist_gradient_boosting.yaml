# ============================================================
#  HistGradientBoostingClassifier  (≈ LightGBM in sklearn)
#  Histogram-based GBDT — very fast even on 13k samples × 267 features.
#  learning_rate × max_iter is the key trade-off: smaller lr needs more trees.
#  max_leaf_nodes controls tree complexity (default 31).
#  l2_regularization: shrinks leaf values → prevents overfitting.
#  min_samples_leaf: minimum samples per leaf (higher = smoother model).
# ============================================================

data_path:      "data/raw/train_nt.csv"
test_data_path: "data/raw/test_nolabels_nt.csv"
target_col:     "position"
test_size:      0.2

add_magnitude_features: true
use_pca:        false

model_name: "hist_gradient_boosting"
cv_folds:   5
scoring:    "f1_macro"

param_grid:
  learning_rate:     [0.03, 0.05, 0.1, 0.15, 0.2]
  max_iter:          [200, 400]
  max_leaf_nodes:    [15, 31, 63, 127]
  max_depth:         [5, 8, 12]
  min_samples_leaf:  [10, 20, 50]
  l2_regularization: [0.0, 0.1, 1.0, 10.0]
  early_stopping:    ['auto']     # stops when val score doesn't improve
  random_state:      [42]
