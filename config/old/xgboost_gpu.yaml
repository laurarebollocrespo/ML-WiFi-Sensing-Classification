# ============================================================
#  XGBoost (GPU) — Fine search for MareNostrum 5
#  Replaces HistGradientBoosting with GPU-accelerated training.
#  Expected to outperform CPU models and scale efficiently.
# ============================================================

data_path:      "data/raw/train_nt.csv"
test_data_path: "data/raw/test_nolabels_nt.csv"
target_col:     "position"
test_size:      0.2

model_name: "xgboost_gpu"
cv_folds:   5
scoring:    "f1_macro"

param_grid:
  n_estimators:      [300, 600, 900]
  learning_rate:     [0.03, 0.05, 0.1]
  max_depth:         [6, 8, 10]
  min_child_weight:  [1, 3, 5]
  subsample:         [0.7, 0.9, 1.0]
  colsample_bytree:  [0.7, 0.9, 1.0]
  gamma:             [0, 1, 5]
  reg_alpha:         [0.0, 0.1, 0.5]
  reg_lambda:        [0.5, 1.0, 2.0]
  tree_method:       ["gpu_hist"]     # GPU-accelerated histogram algorithm
  predictor:         ["gpu_predictor"]
  random_state:      [42]