# Data settings
data_path: "data/processed/train_features.csv"
test_data_path: "data/processed/test_features.csv"
target_col: "position"
test_size: 0.2
models_dir: "outputs/models"
experiments_dir: "outputs/experiments"
submissions_dir: "outputs/submissions"

# Training settings
model_name: "hist_gradient_boosting"
cv_folds: 5
scoring: "f1_macro"

# Hyperparameter Search Space
param_grid:
  learning_rate: [0.01, 0.1, 0.2]
  max_iter: [100, 200]
  max_depth: [null, 5, 10]