# Data paths (preprocessed in PREPROCESSING.ipynb)
train_path: "data/processed/Xtrain_lightgbm.csv"
val_path: "data/processed/Xval_lightgbm.csv"
test_path: "data/processed/Xtest_lightgbm.csv"

model_name: "lightgbm"
target_col: "position"
cv_folds: 5
scoring: "f1_macro"

param_grid:
  boosting_type: ['gbdt', 'dart']
  num_leaves: [31, 50, 70]
  max_depth: [6, 8, 10]
  learning_rate: [0.05, 0.1]
  feature_fraction: [0.7, 0.9]
  n_estimators: [300, 500, 800]
