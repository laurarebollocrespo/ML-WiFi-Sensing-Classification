# Data settings
data_path: "data/raw/train_nt.csv" # Adjust based on your chosen dataset
test_data_path: "data/raw/test_nolabels_nt.csv" # Ensure this matches the train data type
target_col: "position"
test_size: 0.2


# Training settings
model_name: "logistic"
cv_folds: 5
scoring: "f1_macro"

# Hyperparameter Search Space
param_grid:
  solver: ['lbfgs', 'saga']
  C: [0.01, 0.1, 1.0, 10.0]     # Inverse of regularization strength
  max_iter: [1000]              # Needs more iterations to converge