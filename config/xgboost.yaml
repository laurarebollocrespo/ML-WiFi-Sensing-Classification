# Non-scaled — XGBoost is tree-based; no scaling needed
train_path: "data/processed/X_train_non_scaled.csv"
val_path: "data/processed/X_val_non_scaled.csv"
test_path: "data/processed/X_test_non_scaled.csv"
y_train_path: "data/processed/y_train.csv"
y_val_path: "data/processed/y_val.csv"

model_name: "xgboost"
target_col: "position"
cv_folds: 5
scoring: "f1_macro"

param_grid:
  tree_method: ["hist"]
  learning_rate: [0.05, 0.1]
  n_estimators: [300, 500]
  max_depth: [5, 7, 10]
  subsample: [0.6, 0.8, 1.0]
  colsample_bytree: [0.6, 0.8, 1.0]
  gamma: [0, 0.1, 1.0]
  n_jobs: [-1]
