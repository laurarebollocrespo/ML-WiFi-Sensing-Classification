# Data settings
data_path: "data/processed/train_lof_boxcox.csv"
test_data_path: "data/processed/test_boxcox.csv" # Match the BoxCox, ignore the LOF!
target_col: "position"
test_size: 0.2
models_dir: "outputs/models"
experiments_dir: "outputs/experiments"
submissions_dir: "outputs/submissions"

# Training settings
model_name: "mlp"
cv_folds: 3
scoring: "f1_macro"

# Hyperparameter Search Space
param_grid:
  hidden_layer_sizes: 
    - [50]
    - [100]
    - [50, 50]
  activation: ['relu', 'tanh']
  alpha: [0.0001, 0.001, 0.01]
  max_iter: [500]