# Robust scaling — neural nets need normalized inputs; less sensitive to outliers than StandardScaler
train_path: "data/processed/X_train_robust_scaled.csv"
val_path: "data/processed/X_val_robust_scaled.csv"
test_path: "data/processed/X_test_robust_scaled.csv"
y_train_path: "data/processed/y_train.csv"
y_val_path: "data/processed/y_val.csv"

model_name: "mlp"
target_col: "position"
cv_folds: 5
scoring: "f1_macro"

param_grid:
  hidden_layer_sizes:
    - [128]
    - [256]
    - [256, 128]
    - [512, 256]
    - [512, 256, 128]
  activation: ["relu", "tanh"]
  alpha: [0.0001, 0.001, 0.01]
  learning_rate: ["constant", "adaptive"]
  max_iter: [500]
  early_stopping: [true]
  random_state: [42]
