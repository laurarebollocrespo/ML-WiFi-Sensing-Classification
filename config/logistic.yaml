# Robust scaling — linear model benefits from feature normalization
train_path: "data/processed/X_train_robust_scaled.csv"
val_path: "data/processed/X_val_robust_scaled.csv"
test_path: "data/processed/X_test_robust_scaled.csv"
y_train_path: "data/processed/y_train.csv"
y_val_path: "data/processed/y_val.csv"

model_name: "logistic"
target_col: "position"
cv_folds: 5
scoring: "f1_macro"

param_grid:
  solver: ["lbfgs"]
  penalty: ["l2"]
  C: [0.01, 0.1, 0.5, 1.0, 5.0, 10.0]
  max_iter: [2000]
