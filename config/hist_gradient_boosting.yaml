# Non-scaled — fast histogram GBDT; same setup as LightGBM/CatBoost in EDA
train_path: "data/processed/X_train_non_scaled.csv"
val_path: "data/processed/X_val_non_scaled.csv"
test_path: "data/processed/X_test_non_scaled.csv"
y_train_path: "data/processed/y_train.csv"
y_val_path: "data/processed/y_val.csv"

model_name: "hist_gradient_boosting"
target_col: "position"
cv_folds: 5
scoring: "f1_macro"

param_grid:
  learning_rate: [0.05, 0.1, 0.15]
  max_iter: [200, 400]
  max_leaf_nodes: [31, 63, 127]
  max_depth: [6, 10, 12]
  min_samples_leaf: [10, 20, 50]
  l2_regularization: [0.0, 0.1, 1.0]
  early_stopping: ["auto"]
  random_state: [42]
