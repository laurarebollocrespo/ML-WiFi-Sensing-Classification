# ============================================================
#  HistGradientBoosting — Fine search  (run after hist_gradient_boosting.yaml)
#  HGBT is typically the best sklearn model for tabular classification.
#  Expected to push past the SVM 0.94 baseline.
# ============================================================

data_path:      "data/raw/train_nt.csv"
test_data_path: "data/raw/test_nolabels_nt.csv"
target_col:     "position"
test_size:      0.2

add_magnitude_features: true
use_pca:        false

model_name: "hist_gradient_boosting"
cv_folds:   5
scoring:    "f1_macro"

param_grid:
  learning_rate:     [0.04, 0.05, 0.06, 0.08, 0.10]
  max_iter:          [500, 700, 1000]
  max_leaf_nodes:    [31, 63, 95]
  max_depth:         [null, 8, 10]
  min_samples_leaf:  [10, 20, 30]
  l2_regularization: [0.0, 0.05, 0.1, 0.5]
  max_bins:          [128, 255]       # 255 = maximum histogram resolution
  early_stopping:    ['auto']
  random_state:      [42]
