# Data settings
data_path: "data/raw/train_nt.csv" # Adjust based on your chosen dataset
test_data_path: "data/raw/test_nolabels_nt.csv" # Ensure this matches the train data type
target_col: "position"
test_size: 0.2

# Training settings
model_name: "svm"
cv_folds: 5
scoring: "f1_macro"

# Hyperparameter Search Space
param_grid:
  kernel: ['rbf']
  C: [15]          # Setting the optimal C directly
  gamma: [0.0125]  # Setting the optimal gamma directly