# Data settings
data_path: "data/processed/train_features_boxcox.csv"
test_data_path: "data/processed/test_features_boxcox.csv"
target_col: "position"
test_size: 0.2
models_dir: "outputs/models"
experiments_dir: "outputs/experiments"
submissions_dir: "outputs/submissions"

# Training settings
model_name: "svm"
cv_folds: 3 # Lowered to 3 because SVMs are SLOW to train
scoring: "f1_macro"

# Hyperparameter Search Space
param_grid:
  kernel: ['rbf']
  C: [0.1, 1, 10]
  gamma: ['scale', 'auto', 0.1]